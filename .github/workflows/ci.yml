# ci.yml — the project's verification gate. No developer/agent sandbox has bun+docker, so THIS is the only
# place the gates and the integration suite actually run. Two jobs:
#   • gates  — typecheck (turbo) + biome + dependency-cruiser boundaries + unit tests (bun test). Fast, no services.
#   • itests — every *.itest.ts against real Postgres 16 + Redis 7 service containers.
# The itests are named *.itest.ts so the default `bun test` (units) skips them; they run explicitly here, each
# in its OWN process because the @leadwolf/db client is a module singleton and itestDb.ts (external mode, via
# ITEST_DATABASE_URL) provisions an isolated database per file. Globbing *.itest.ts means this auto-covers new
# suites (e.g. work/worker-a rls-isolation, work/worker-b imports.queue/resilience) the moment they land on main.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  # actions: read — for the "nightly still firing?" step in the gates job. Read-only metadata about THIS
  # repository's own workflow runs: no write of any kind, no secrets, no other repository. It is here because
  # a scheduled workflow cannot detect its own absence, and the triggers that fire RELIABLY are push and
  # pull_request — so the reliable trigger has to watch the unreliable one.
  actions: read

# Supersede in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set so the integration suite runs against the service containers below instead of spawning Testcontainers
  # (no docker-in-docker needed). itestDb.ts uses ITEST_DATABASE_URL (external mode, one DB per file); the
  # apps/workers import itests use ITEST_REDIS_URL.
  ITEST_DATABASE_URL: postgres://leadwolf:leadwolf@localhost:5432/leadwolf
  ITEST_REDIS_URL: redis://localhost:6379
  # Two jobs at once. (1) @leadwolf/config requires it in production — CI is not NODE_ENV=production so that
  # guard is inert, but it is set so nothing trips. (2) E-6.3: it makes the runtime pool derive a leadwolf_app
  # LOGIN connection for withTenantTx instead of falling back to the owner, so the RLS-by-connection path is
  # actually EXERCISED here rather than shipping untested.
  # The value MUST equal applyMigrations. DEFAULT_APP_ROLE_PASSWORD — the itests call applyMigrations() with no
  # override, so that is the password the role is created with, and it is the same literal itestDb.ts already
  # hardcodes for its RLS proofs. A mismatch here fails every itest at connection time.
  DATABASE_APP_ROLE_PASSWORD: Lw_App_Role_2026!x7Qm
  # E-6.6: grants leadwolf_forge LOGIN and makes the Forge pool AUTHENTICATE as it, so the same-repo firewall
  # is enforced by the connection rather than by a SET LOCAL ROLE that has to succeed. Set here so the path is
  # exercised — applyMigrations reads it from process.env when the itests call it without options, and
  # client.ts derives the same credentials, so the two match.
  DATABASE_FORGE_ROLE_PASSWORD: Lw_Forge_Role_2026!x7Qm
  # The itests set this themselves in beforeAll; provided here too for any unit test that touches blind-index/PII.
  BLIND_INDEX_KEY: ci-blind-index-key-0123456789abcdef
  # packages/auth botCheck.test.ts exercises the ENFORCED Turnstile path; @leadwolf/config snapshots process.env
  # at import, so the secret must exist before any module loads — a test-only value, never a real key.
  TURNSTILE_SECRET: ci-turnstile-test-secret

jobs:
  gates:
    name: Gates — typecheck · biome · boundaries · build · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: lint:outcome-tags reads `origin/main..HEAD`, and the default shallow clone has
          # neither the base ref nor the merge base. The repo is 18.6 MiB / 1847 commits, so this costs
          # a moment; a shallow clone would cost the check entirely.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # --frozen-lockfile fails if any package.json gained a dep without bun.lock being refreshed — the
      # forcing function for "run bun install after pulling a feature branch".
      - name: Install (frozen lockfile)
        # One retry: the registry intermittently fails extracting big tarballs ("failed to download next") —
        # it has killed whole itest jobs three times; a 10s backoff has always been enough.
        run: bun install --frozen-lockfile || (sleep 10 && bun install --frozen-lockfile)
      - name: Typecheck
        run: bun run typecheck
      # The package typecheck above covers `src` only, so packages/db's itest files (107 of them) were never
      # checked at all — bun compiles them at run time. That is how a wrong applyMigrations signature passed
      # typecheck, passed lint, and failed here behind "password authentication failed for user runner".
      # The exclusion ratchet this comment used to describe ("76 clean, 17 excluded") is CLOSED:
      # tsconfig.typecheck.json now has no exclude list and every test file in the package is checked. Do not
      # reintroduce one — an exclusion there is a file nobody type-checks, which is the exact condition that
      # let the bug above through.
      - name: Typecheck out-of-src tests (db, workers, forge-worker)
        # These three packages keep their tests OUTSIDE src, so the per-package typecheck above — which
        # includes only "src" — never saw them. That is how a wrong applyMigrations signature passed typecheck,
        # passed lint, and failed here behind "password authentication failed for user runner".
        run: |
          bun run --filter @leadwolf/db typecheck:tests
          bun run --filter @leadwolf/workers typecheck:tests
          bun run --filter @leadwolf/forge-worker typecheck:tests
      - name: Lint (biome)
        run: bun run lint
      - name: Import boundaries (dependency-cruiser)
        run: bun run lint:boundaries
      # The three script-based gates CLAUDE.md lists alongside biome and dependency-cruiser. They were NOT
      # running here — `bun run lint` is `biome check .` and nothing else — so two documented gates existed
      # only as a habit, and the third (itest-rejects) would have arrived stillborn. All three are pure
      # filesystem scans: no services, no env, seconds to run.
      - name: Import-path PII-in-log tripwire
        run: bun run lint:import-pii
      - name: Lockfile hygiene
        run: bun run lint:lockfile
      # Bans expect(...).rejects on a DB call in an *.itest.ts. The failure mode it guards is a HANG, not a
      # red — four suites were each eating their whole timeout before this landed (retention 540s,
      # scheduledImports 240s, enrichmentPolicy 240s, bulkImport.pipeline 120s).
      - name: Integration-test rejection shape
        run: bun run lint:itest-rejects
      # Fails if an env kill-switch is armed in the production template without a recorded reason. Since
      # 0119 flipped the per-tenant half of most flags globally on, arming the env half is often the WHOLE
      # enablement — one template line can take a dark train live for every tenant.
      - name: Production switch posture
        run: bun run lint:prod-switches
      # Scans TRACKED files for credential shapes and for this product's PII formats (.csv/.xlsx/.xls/.rdb).
      # .gitignore stops the accident; this stops `git add -f`, a path that slips a pattern, and a key pasted
      # into source as a temporary default. Asymmetric cost: a wrong commit is a revert, a committed secret is
      # a rotation plus a history rewrite.
      - name: Committed secrets + PII formats
        run: bun run lint:secrets
      # A composite ARIA role with tabIndex={-1} takes those options OUT of the tab order, so arrow keys are
      # the only way to reach them; ship the roving half without a key handler and the control is unreachable
      # by keyboard (WCAG 2.2 SC 2.1.1). apps/doc's playground shipped exactly that, and neither typecheck,
      # biome's a11y rules, nor verify.mjs's accessibility-tree assertions saw it — the STRUCTURE was correct
      # (two radios, right aria-checked) and structure is all they inspect. It took pressing ArrowRight in a
      # real browser. This is the source-level half of that check, which is the half CI can run.
      - name: Roving tabindex needs arrow keys
        run: bun run lint:roving-tabindex
      # A raw hex is a token that stopped tracking the design system: moving --tp-cobalt moves every surface
      # using the token and none that froze its value. It also sits outside apps/doc's contrast.test.ts, which
      # asserts TOKEN pairs, so a hardcoded colour can fail WCAG AA with nothing to notice. truepoint-design
      # states this rule first and its own note says it is "enforced by code review" — the mechanism that had
      # already failed for the three checks above it.
      - name: Design tokens, not raw hex
        run: bun run lint:design-tokens
      # Feature slices must not import each other. dependency-cruiser HAS a rule for this and is blind to
      # every real instance: the cruise runs without a per-app tsconfig, so the `@/*` alias never resolves
      # (measured: 251 unresolved `@/` imports in apps/web, 0 resolved) and the rule cannot see the edge. It
      # fires only for relative imports, which is not how this codebase writes them. This checks the alias
      # text directly, and ratchets apps/web's 9 known imports so they cannot become 10.
      - name: Cross-feature imports
        run: bun run lint:cross-feature
      # Same blind spot, second rule. depcruise carries a no-circular rule at severity "error" and it cannot
      # see `@/…` edges either — it is configured with no options.tsConfig while every app maps "@/*" to
      # "./src/*" — so a cycle built out of alias imports is invisible to it. The clean bill of health it had
      # was a ONE-OFF measurement written into a comment, true when taken and silent about every commit since.
      # This is that measurement as a check: run on main it reproduces the recorded census app for app (976
      # modules: web 490, admin 204, auth 100, doc 82, extension 54, forge 46) and finds zero cycles.
      - name: Import cycles, counting the alias edges depcruise cannot see
        run: bun run lint:alias-cycles
      # `turbo run typecheck typecheck:tests` treats an UNDEFINED task as nothing to do, not as a failure, so
      # the repo's type-check coverage was decided by which package.json files happened to declare which
      # script. Every tsconfig here is `include: ["src"]`, so a test outside src/ is checked only where a
      # typecheck:tests task exists — and three of the six workspaces with out-of-src tests had none. Adding
      # the task to them surfaced four real errors, including two test doubles missing a BffReaders member
      # that the interface requires.
      - name: Type-checking reaches every test file
        run: bun run lint:typecheck-coverage
      # @leadwolf/config validates at IMPORT, so a REQUIRED var missing from the production template is a boot
      # failure, not a missing feature — the process dies with a bare `Required` list naming the key and
      # nothing naming the file that should have carried it. Five of the 154 schema entries are truly
      # required (no .default/.optional); this asserts the template still carries all of them.
      - name: Required env vars appear in the production template
        run: bun run lint:env-template
      # CLAUDE.md rule 1 — "Every feature, commit, and PR names the outcome ID(s) it advances" — is the
      # first binding rule in the file and the only one of the seven a machine can check. Scoped to the
      # commits under review, never history: of the last 300 non-merge commits on main 96% carry a tag, but
      # over the last 1000 it is 36%, so a gate judging the past would be red on arrival and switched off.
      - name: Behaviour-changing commits name an outcome
        run: bun run lint:outcome-tags
      # Rule 7 — no contributor-EARNED currency anywhere. apps/doc has guarded its own copy since the brief
      # behind that portal proposed reviving the economy the strategy pack deleted; nothing guarded the other
      # four apps, packages/ui, or the server. A PURCHASED credit is fine (the ledger is a settlement unit),
      # so the patterns match EARNING one, plus the schema shapes copy patterns cannot see.
      - name: No contributor-earned currency
        run: bun run lint:earned-currency
      # A multi-row INSERT has a hard row ceiling: PostgreSQL caps a statement at 65,534 bind parameters and
      # Drizzle emits ONE statement for .values(array), so a contact (~19 params/row) caps near 3,400 rows —
      # against an importer that plans bands of 10,000. Six call sites exceeded it simultaneously and every
      # bulk import of a full chunk threw. Dark feature + a soak suite that had never run = nobody noticed.
      - name: Batch inserts stay under the bind-parameter ceiling
        run: bun run lint:batch-inserts
      # Every gate above is a regex over source, and SEVEN of this repo's checks have been caught reporting a
      # clean `ok` while blind to the exact defect they were written for — a resolver that never resolved, a
      # lookahead defeated by backtracking, patterns blind to ES6 shorthand, comments counted as code. Each was
      # found by planting a failure by hand. This step does that on every run: it writes a file that MUST trip
      # each gate, requires a non-zero exit that names the plant, removes it, and requires green again. A gate
      # that passes its own plant fails here, by name.
      # A queue with a producer and no consumer fills Redis and never errors: the enqueue succeeds, the jobs
      # sit there, and the only symptom is work that silently never happens. Adding a queue is two edits in two
      # files; this fails the build when the second one is missing. *_DLQ is skipped — a dead-letter queue is a
      # parking lot by design.
      - name: Every queue has a consumer
        run: bun run lint:queue-consumers
      - name: Each gate can still fail (plant-and-check)
        run: bun run lint:gates-selftest
      # Is the nightly still firing? A scheduled workflow cannot detect its own absence: if GitHub delays or
      # DROPS a run — which it does under load, with no guarantee and no notification — the soak simply stops
      # happening, and a nightly that silently stopped looks exactly like one that keeps passing. Observed
      # 2026-08-25: state `active`, 03:17 UTC passed, no run 24 minutes later, nothing reported.
      #
      # WARNS, never fails. A dropped run is GitHub's scheduling, not a defect in the diff being tested, and
      # turning every push red for it would get this step deleted within a week — the fate of any check that
      # blames the wrong person. The annotation is loud enough to notice on a PR and harmless enough to
      # ignore when a lapse is known.
      #
      # Fail-open on the API call itself for the same reason: a fork PR whose token cannot read Actions
      # metadata must not turn red over a monitoring nicety.
      #
      # WHAT IT DOES NOT TELL YOU: it counts ANY run, including a workflow_dispatch. So it answers "did the
      # soak run recently", not "is the SCHEDULE working" — and a cron that has quietly stopped can hide
      # behind manual dispatches indefinitely. That is the right trade for the thing being protected (the
      # TP-2/TP-6 numbers exist either way, and those are what gate the ceiling raise), but if the question
      # you actually have is whether the cron fires, filter on `.event == "schedule"` instead. Verified on the
      # runner 2026-08-25: it read a dispatch from 10h earlier and stayed quiet, which is exactly this
      # behaviour.
      - name: Nightly soak still firing?
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          STALE_HOURS=48
          last="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?per_page=1" \
                    --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)"
          if [ -z "$last" ]; then
            echo "::warning::No nightly run found at all. If the soak matters (TP-2/TP-6 gate the 1M→2M ceiling raise), dispatch one: gh workflow run nightly.yml --ref main"
            exit 0
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "last nightly run: $last (${age_h}h ago)"
          if [ "$age_h" -gt "$STALE_HOURS" ]; then
            echo "::warning::The nightly soak has not run in ${age_h}h (>${STALE_HOURS}h). GitHub may have dropped the schedule — dispatch one: gh workflow run nightly.yml --ref main"
          fi
      # Build every buildable workspace (5 Next apps + the Vite extension). CI previously never built
      # ANYTHING, so a broken production build reached main and first surfaced inside deploy/deploy.sh,
      # minutes into a deploy. Two classes this catches that typecheck cannot:
      #   • packages/* are consumed as raw TS source through their barrels, and tsconfig.base.json sets
      #     noUnusedLocals — so an unused local in packages/ui fails `next build` while `tsc --noEmit`
      #     on that package alone can pass.
      #   • bundler-only resolution failures (a malformed workspace package.json, a bad export map) that
      #     no other gate reads.
      # Env: next build imports packages/config, whose schema fails fast on missing keys. These are throwaway CI
      # values — never real credentials.
      #
      # NODE_ENV must be `production`: `next build` under NODE_ENV=development mixes the dev and prod React
      # runtimes and crashes prerendering with "<Html> should not be imported outside of pages/_document" on
      # /404. deploy.sh already refuses to deploy an env file containing NODE_ENV=development for exactly this
      # reason — the build gate has to match that, or it tests a configuration nothing ever ships.
      #
      # Because it IS a production build, packages/config's production-only superRefine asserts apply, so the
      # values below have to be internally consistent: AUTH_COOKIE_DOMAIN = the AUTH_ORIGIN host,
      # NEXT_PUBLIC_AUTH_ORIGIN = AUTH_ORIGIN, and NEXT_PUBLIC_APP_ORIGIN present in APP_ORIGINS.
      # apps/auth prerenders /.well-known/jwks.json, which calls getJwks() and therefore needs real signing-key
      # material at BUILD time. Generated fresh per run rather than committed: a checked-in private key — even a
      # throwaway — is the kind of thing secret scanners flag and humans later copy. Mirrors deploy/gen-keys.sh,
      # and the base64 single-line transport is what packages/config expects (a multi-line PEM does not survive
      # env interpolation — that is the ADR-0016 token_mint_failed outage).
      - name: Generate a throwaway Ed25519 signing key for the build
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          openssl genpkey -algorithm ED25519 -out "$tmp/jwt.pem"
          openssl pkey -in "$tmp/jwt.pem" -pubout -out "$tmp/jwt.pub.pem"
          echo "JWT_PRIVATE_KEY_PEM_B64=$(base64 -w0 "$tmp/jwt.pem")" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PEM_B64=$(base64 -w0 "$tmp/jwt.pub.pem")" >> "$GITHUB_ENV"
          rm -rf "$tmp"
      - name: Build (turbo — 5 Next apps + extension)
        env:
          NODE_ENV: production
          AUTH_ORIGIN: https://auth.test
          APP_ORIGINS: https://app.test,https://admin.test,https://forge.test
          AUTH_COOKIE_DOMAIN: auth.test
          AUTH_BIND_IP: "off"
          JWT_SIGNING_KID: ci-kid
          NEXT_PUBLIC_APP_ORIGIN: https://app.test
          NEXT_PUBLIC_AUTH_ORIGIN: https://auth.test
          DATABASE_URL: postgres://leadwolf:leadwolf@localhost:5432/leadwolf
          REDIS_URL: redis://localhost:6379
          BLIND_INDEX_KEY: ci-blind-index-key-0123456789abcdef
        run: bun run build
      # A build that builds NOTHING exits 0. `turbo run build` is unfiltered here, so a broken `workspaces`
      # glob in the root package.json, a renamed per-app script, or a turbo.json edit that stops matching
      # leaves "no tasks to run" — success, under a step whose own title promises six artifacts. Name them.
      #
      # .next/BUILD_ID is written at the END of a successful next build, so it cannot exist for a build that
      # started and died. manifest.json is the extension's vite output. Both live inside the paths turbo
      # declares as build outputs ("dist/**", ".next/**"), so a cache HIT — which legitimately restores the
      # artifacts without re-running the builders — still satisfies this. The invariant asserted is "the
      # outputs exist", not "work was performed"; the second would go red on every cached run.
      - name: The build produced its six artifacts
        run: |
          missing=()
          for app in web admin auth forge doc; do
            [ -f "apps/$app/.next/BUILD_ID" ] || missing+=("apps/$app/.next/BUILD_ID")
          done
          [ -f "apps/extension/dist/manifest.json" ] || missing+=("apps/extension/dist/manifest.json")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Build step reported success but ${#missing[@]} of 6 artifacts are absent: ${missing[*]} — turbo built nothing or built less than this job claims."
            exit 1
          fi
          echo "6/6 build artifacts present."
      # The developer portal's compliance guarantees are about DELIVERED HTML, and no unit test can assert
      # those: content.test.ts proves the content MODULES carry no rule-4/rule-7 copy, but an edit that
      # hardcoded a claim straight into JSX would sail past it. So the portal is started and probed here.
      #
      # This is cheap and safe to put in the gates job precisely because of what apps/doc is: it needs no
      # env, no database, no Redis and no API (the doc-app-holds-no-data-path boundary rule is what
      # guarantees that), so `next start` comes up on a bare runner in seconds. NODE_ENV=production so the
      # security headers, which are production-gated, are actually present to assert.
      #
      # The trap cleans up even when verify fails, so a failing gate cannot leave the job hanging on a live
      # server. `wait-for` bounds startup at 30s rather than trusting a fixed sleep.
      - name: Developer portal — rendered-HTML + a11y + CSP checks
        env:
          NODE_ENV: production
        run: |
          set -uo pipefail
          bun run --filter @leadwolf/doc start &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3007/ >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3007/ >/dev/null || { echo "portal did not start within 30s"; exit 1; }
          bun run --filter @leadwolf/doc verify
      # Each *.test.ts runs in its OWN bun process, mirroring the itests step below and for the same reason:
      # module singletons (mock.module patches, the auth metrics registry, env snapshots) bleed across files
      # in one shared process — the suites were authored under per-file isolation.
      - name: Unit tests (each file in its own process)
        run: |
          set -uo pipefail
          mapfile -t files < <(find packages apps -name '*.test.ts' -o -name '*.test.tsx' | sort)
          # Zero is a BROKEN GLOB, not an empty repo: there are 320 of these files. A rename, a moved
          # directory or a changed extension would otherwise pass a build that ran no tests at all — which is
          # precisely what the nightly's own confirm step treats as an error, and CI should not disagree with
          # it about that. (One line: a `::error::` annotation cannot span newlines.)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No *.test.ts found — this repo has 320, so the glob broke. Refusing to report green on a build that ran no tests."
            exit 1
          fi
          printf 'Found %d unit test file(s):\n' "${#files[@]}"
          status=0
          for f in "${files[@]}"; do
            echo "::group::bun test ${f}"
            if ! bun test "./${f}"; then
              status=1
              echo "::error file=${f}::unit test failed"
            fi
            echo "::endgroup::"
          done
          exit "${status}"

  itests:
    name: Integration tests — *.itest.ts on Postgres + Redis (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 129 itest files × (own DB + full migrations each) never fit one 30-minute job — every prior itests
    # "cancelled" was this timeout. Four round-robin shards (32-33 files each) keep every job under the
    # ceiling. The shard split is `find | sort` + index mod 4, so a NEW *.itest.ts is picked up with no
    # registry to update — but watch the per-shard count as files are added: the 40-minute ceiling is the
    # next thing to give, and the fix is a fifth shard, not a longer timeout.
    #
    # Count updated 2026-08-22 (was 114/~29). The ceiling got FURTHER away despite the growth, because four
    # suites were each stalling on the banned `expect(...).rejects` shape rather than failing — roughly 19
    # minutes of pure wall-clock, unevenly spread: shard 3 lost 9 min to retention alone, shard 1 lost 6 min
    # across scheduledImports + bulkImport.pipeline, shard 2 lost 4 min to enrichmentPolicy. All four are
    # fixed and `bun run lint:itest-rejects` now fails the shape in the gates job, so that class of silent
    # budget burn cannot come back. Read a rising shard time as new work, not as this.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadwolf
          POSTGRES_PASSWORD: leadwolf
          POSTGRES_DB: leadwolf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadwolf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install (frozen lockfile)
        # One retry: the registry intermittently fails extracting big tarballs ("failed to download next") —
        # it has killed whole itest jobs three times; a 10s backoff has always been enough.
        run: bun install --frozen-lockfile || (sleep 10 && bun install --frozen-lockfile)
      - name: Run every *.itest.ts in its own process
        run: |
          set -uo pipefail
          mapfile -t all < <(find packages apps -name '*.itest.ts' | sort)
          files=()
          for i in "${!all[@]}"; do
            if [ $((i % 4)) -eq ${{ matrix.shard }} ]; then files+=("${all[$i]}"); fi
          done
          # The TOTAL, checked before sharding. A shard legitimately drawing nothing is possible only when the
          # whole set is smaller than the shard count; with 131 files, an empty total means the glob broke and
          # every shard would then pass green having run nothing.
          if [ "${#all[@]}" -eq 0 ]; then
            echo "::error::No *.itest.ts found at all — this repo has 131, so the glob broke. All four shards would otherwise report green on an empty set."
            exit 1
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Shard ${{ matrix.shard }}/4 drew no files from ${#all[@]} — fewer files than shards."
            exit 0
          fi
          printf 'Shard ${{ matrix.shard }}/4 — %d of %d integration test file(s):\n' "${#files[@]}" "${#all[@]}"
          printf '  %s\n' "${files[@]}"
          status=0
          for f in "${files[@]}"; do
            echo "::group::bun test ${f}"
            # --timeout: a single hung await must FAIL with the test's name, never eat the job's
            # 40-minute ceiling in silence (importCopyRouting did exactly that).
            if ! bun test --timeout 120000 "./${f}"; then
              status=1
              echo "::error file=${f}::integration test failed"
            fi
            echo "::endgroup::"
          done
          exit "${status}"

  # cascade/ is a SEPARATE project (its own workspace root, its own Postgres schema, no imports from
  # apps/* or packages/*), so the root `bun install` does not install its dependencies and the root
  # `bun test` does not discover its suites. It gets its own job rather than being wired into the
  # monorepo's — that separation is deliberate (see cascade/README.md).
  # No services needed: @electric-sql/pglite runs a real Postgres engine in-process.
  cascade:
    name: CASCADE — typecheck · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cascade
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile || (sleep 10 && bun install --frozen-lockfile)
      - name: Typecheck every package
        run: bun run --filter '*' typecheck
      - name: Acceptance + API contract tests
        run: bun test
