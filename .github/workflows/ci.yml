# ci.yml — the project's verification gate. No developer/agent sandbox has bun+docker, so THIS is the only
# place the gates and the integration suite actually run. Two jobs:
#   • gates  — typecheck (turbo) + biome + dependency-cruiser boundaries + unit tests (bun test). Fast, no services.
#   • itests — every *.itest.ts against real Postgres 16 + Redis 7 service containers.
# The itests are named *.itest.ts so the default `bun test` (units) skips them; they run explicitly here, each
# in its OWN process because the @leadwolf/db client is a module singleton and itestDb.ts (external mode, via
# ITEST_DATABASE_URL) provisions an isolated database per file. Globbing *.itest.ts means this auto-covers new
# suites (e.g. work/worker-a rls-isolation, work/worker-b imports.queue/resilience) the moment they land on main.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set so the integration suite runs against the service containers below instead of spawning Testcontainers
  # (no docker-in-docker needed). itestDb.ts uses ITEST_DATABASE_URL (external mode, one DB per file); the
  # apps/workers import itests use ITEST_REDIS_URL.
  ITEST_DATABASE_URL: postgres://leadwolf:leadwolf@localhost:5432/leadwolf
  ITEST_REDIS_URL: redis://localhost:6379
  # Two jobs at once. (1) @leadwolf/config requires it in production — CI is not NODE_ENV=production so that
  # guard is inert, but it is set so nothing trips. (2) E-6.3: it makes the runtime pool derive a leadwolf_app
  # LOGIN connection for withTenantTx instead of falling back to the owner, so the RLS-by-connection path is
  # actually EXERCISED here rather than shipping untested.
  # The value MUST equal applyMigrations. DEFAULT_APP_ROLE_PASSWORD — the itests call applyMigrations() with no
  # override, so that is the password the role is created with, and it is the same literal itestDb.ts already
  # hardcodes for its RLS proofs. A mismatch here fails every itest at connection time.
  DATABASE_APP_ROLE_PASSWORD: Lw_App_Role_2026!x7Qm
  # E-6.6: grants leadwolf_forge LOGIN and makes the Forge pool AUTHENTICATE as it, so the same-repo firewall
  # is enforced by the connection rather than by a SET LOCAL ROLE that has to succeed. Set here so the path is
  # exercised — applyMigrations reads it from process.env when the itests call it without options, and
  # client.ts derives the same credentials, so the two match.
  DATABASE_FORGE_ROLE_PASSWORD: Lw_Forge_Role_2026!x7Qm
  # The itests set this themselves in beforeAll; provided here too for any unit test that touches blind-index/PII.
  BLIND_INDEX_KEY: ci-blind-index-key-0123456789abcdef
  # packages/auth botCheck.test.ts exercises the ENFORCED Turnstile path; @leadwolf/config snapshots process.env
  # at import, so the secret must exist before any module loads — a test-only value, never a real key.
  TURNSTILE_SECRET: ci-turnstile-test-secret

jobs:
  gates:
    name: Gates — typecheck · biome · boundaries · build · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # --frozen-lockfile fails if any package.json gained a dep without bun.lock being refreshed — the
      # forcing function for "run bun install after pulling a feature branch".
      - name: Install (frozen lockfile)
        # One retry: the registry intermittently fails extracting big tarballs ("failed to download next") —
        # it has killed whole itest jobs three times; a 10s backoff has always been enough.
        run: bun install --frozen-lockfile || (sleep 10 && bun install --frozen-lockfile)
      - name: Typecheck
        run: bun run typecheck
      # The package typecheck above covers `src` only, so packages/db's itest files (107 of them) were never
      # checked at all — bun compiles them at run time. That is how a wrong applyMigrations signature passed
      # typecheck, passed lint, and failed here behind "password authentication failed for user runner".
      # The exclusion ratchet this comment used to describe ("76 clean, 17 excluded") is CLOSED:
      # tsconfig.typecheck.json now has no exclude list and every test file in the package is checked. Do not
      # reintroduce one — an exclusion there is a file nobody type-checks, which is the exact condition that
      # let the bug above through.
      - name: Typecheck out-of-src tests (db, workers, forge-worker)
        # These three packages keep their tests OUTSIDE src, so the per-package typecheck above — which
        # includes only "src" — never saw them. That is how a wrong applyMigrations signature passed typecheck,
        # passed lint, and failed here behind "password authentication failed for user runner".
        run: |
          bun run --filter @leadwolf/db typecheck:tests
          bun run --filter @leadwolf/workers typecheck:tests
          bun run --filter @leadwolf/forge-worker typecheck:tests
      - name: Lint (biome)
        run: bun run lint
      - name: Import boundaries (dependency-cruiser)
        run: bun run lint:boundaries
      # Build every buildable workspace (5 Next apps + the Vite extension). CI previously never built
      # ANYTHING, so a broken production build reached main and first surfaced inside deploy/deploy.sh,
      # minutes into a deploy. Two classes this catches that typecheck cannot:
      #   • packages/* are consumed as raw TS source through their barrels, and tsconfig.base.json sets
      #     noUnusedLocals — so an unused local in packages/ui fails `next build` while `tsc --noEmit`
      #     on that package alone can pass.
      #   • bundler-only resolution failures (a malformed workspace package.json, a bad export map) that
      #     no other gate reads.
      # Env: next build imports packages/config, whose schema fails fast on missing keys. These are throwaway CI
      # values — never real credentials.
      #
      # NODE_ENV must be `production`: `next build` under NODE_ENV=development mixes the dev and prod React
      # runtimes and crashes prerendering with "<Html> should not be imported outside of pages/_document" on
      # /404. deploy.sh already refuses to deploy an env file containing NODE_ENV=development for exactly this
      # reason — the build gate has to match that, or it tests a configuration nothing ever ships.
      #
      # Because it IS a production build, packages/config's production-only superRefine asserts apply, so the
      # values below have to be internally consistent: AUTH_COOKIE_DOMAIN = the AUTH_ORIGIN host,
      # NEXT_PUBLIC_AUTH_ORIGIN = AUTH_ORIGIN, and NEXT_PUBLIC_APP_ORIGIN present in APP_ORIGINS.
      # apps/auth prerenders /.well-known/jwks.json, which calls getJwks() and therefore needs real signing-key
      # material at BUILD time. Generated fresh per run rather than committed: a checked-in private key — even a
      # throwaway — is the kind of thing secret scanners flag and humans later copy. Mirrors deploy/gen-keys.sh,
      # and the base64 single-line transport is what packages/config expects (a multi-line PEM does not survive
      # env interpolation — that is the ADR-0016 token_mint_failed outage).
      - name: Generate a throwaway Ed25519 signing key for the build
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          openssl genpkey -algorithm ED25519 -out "$tmp/jwt.pem"
          openssl pkey -in "$tmp/jwt.pem" -pubout -out "$tmp/jwt.pub.pem"
          echo "JWT_PRIVATE_KEY_PEM_B64=$(base64 -w0 "$tmp/jwt.pem")" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PEM_B64=$(base64 -w0 "$tmp/jwt.pub.pem")" >> "$GITHUB_ENV"
          rm -rf "$tmp"
      - name: Build (turbo — 5 Next apps + extension)
        env:
          NODE_ENV: production
          AUTH_ORIGIN: https://auth.test
          APP_ORIGINS: https://app.test,https://admin.test,https://forge.test
          AUTH_COOKIE_DOMAIN: auth.test
          AUTH_BIND_IP: "off"
          JWT_SIGNING_KID: ci-kid
          NEXT_PUBLIC_APP_ORIGIN: https://app.test
          NEXT_PUBLIC_AUTH_ORIGIN: https://auth.test
          DATABASE_URL: postgres://leadwolf:leadwolf@localhost:5432/leadwolf
          REDIS_URL: redis://localhost:6379
          BLIND_INDEX_KEY: ci-blind-index-key-0123456789abcdef
        run: bun run build
      # Each *.test.ts runs in its OWN bun process, mirroring the itests step below and for the same reason:
      # module singletons (mock.module patches, the auth metrics registry, env snapshots) bleed across files
      # in one shared process — the suites were authored under per-file isolation.
      - name: Unit tests (each file in its own process)
        run: |
          set -uo pipefail
          mapfile -t files < <(find packages apps -name '*.test.ts' -o -name '*.test.tsx' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No *.test.ts found — nothing to run."
            exit 0
          fi
          printf 'Found %d unit test file(s):\n' "${#files[@]}"
          status=0
          for f in "${files[@]}"; do
            echo "::group::bun test ${f}"
            if ! bun test "./${f}"; then
              status=1
              echo "::error file=${f}::unit test failed"
            fi
            echo "::endgroup::"
          done
          exit "${status}"

  itests:
    name: Integration tests — *.itest.ts on Postgres + Redis (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 114 itest files × (own DB + full migrations each) never fit one 30-minute job — every prior itests
    # "cancelled" was this timeout. Four round-robin shards (~29 files each) keep every job under the ceiling.
    # The shard split is `find | sort` + index mod 4, so a NEW *.itest.ts is picked up with no registry to
    # update — but watch the per-shard count as files are added: the 40-minute ceiling is the next thing to
    # give, and the fix is a fifth shard, not a longer timeout.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadwolf
          POSTGRES_PASSWORD: leadwolf
          POSTGRES_DB: leadwolf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadwolf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install (frozen lockfile)
        # One retry: the registry intermittently fails extracting big tarballs ("failed to download next") —
        # it has killed whole itest jobs three times; a 10s backoff has always been enough.
        run: bun install --frozen-lockfile || (sleep 10 && bun install --frozen-lockfile)
      - name: Run every *.itest.ts in its own process
        run: |
          set -uo pipefail
          mapfile -t all < <(find packages apps -name '*.itest.ts' | sort)
          files=()
          for i in "${!all[@]}"; do
            if [ $((i % 4)) -eq ${{ matrix.shard }} ]; then files+=("${all[$i]}"); fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No *.itest.ts found — nothing to run."
            exit 0
          fi
          printf 'Shard ${{ matrix.shard }}/4 — %d of %d integration test file(s):\n' "${#files[@]}" "${#all[@]}"
          printf '  %s\n' "${files[@]}"
          status=0
          for f in "${files[@]}"; do
            echo "::group::bun test ${f}"
            # --timeout: a single hung await must FAIL with the test's name, never eat the job's
            # 40-minute ceiling in silence (importCopyRouting did exactly that).
            if ! bun test --timeout 120000 "./${f}"; then
              status=1
              echo "::error file=${f}::integration test failed"
            fi
            echo "::endgroup::"
          done
          exit "${status}"

  # cascade/ is a SEPARATE project (its own workspace root, its own Postgres schema, no imports from
  # apps/* or packages/*), so the root `bun install` does not install its dependencies and the root
  # `bun test` does not discover its suites. It gets its own job rather than being wired into the
  # monorepo's — that separation is deliberate (see cascade/README.md).
  # No services needed: @electric-sql/pglite runs a real Postgres engine in-process.
  cascade:
    name: CASCADE — typecheck · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cascade
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile || (sleep 10 && bun install --frozen-lockfile)
      - name: Typecheck every package
        run: bun run --filter '*' typecheck
      - name: Acceptance + API contract tests
        run: bun test
