# nightly.yml — the schedule the soak suites were written for, which did not exist.
#
# THE GAP THIS CLOSES. Three integration files gate themselves on an environment variable and skip otherwise:
#
#   packages/db/test/importSoak.nightly.itest.ts          NIGHTLY_SOAK=true
#   apps/workers/test/importSoak.fairness.nightly.itest.ts NIGHTLY_SOAK=true
#   packages/integrations/src/storage/s3FileStore.itest.ts BULK_IMPORT_S3_* credentials
#
# `NIGHTLY_SOAK` was set NOWHERE — not in ci.yml, not in the env template, and there was no second workflow.
# So "nightly" named a cadence that had never run: those files have been skipping since the day they were
# written, on every PR and every push, and reporting green for it. A suite that cannot execute is the same
# failure as a lint rule that cannot fail, and this repo found four of those today.
#
# WHAT RUNS HERE is 20,000 rows, NOT the suites' own 10,000-row smoke default — and the difference is not
# arbitrary. TP-6 asserts that the loader's memory PLATEAUS: `max(RSS) - max(RSS over the first half of the
# samples) <= 64 MB`. Measured on both sizes:
#
#   10,000 rows : RSS max 248.4 MB, first half  42.1 MB  → 206 MB "growth"  → FAILS
#   20,000 rows : RSS max 248.1 MB, first half 244.6 MB  →   3.5 MB growth  → passes
#
# The max is IDENTICAL at both sizes, so nothing is leaking — 248 MB is the steady-state working set. At
# 10,000 rows the run simply ends before the first half of the samples clears warm-up, so the assertion
# measures the ramp rather than the plateau and reports a fixed cost as unbounded growth. Running the smoke
# default here would have made this workflow permanently red on its first night, for a reason that is an
# artifact of the sample window — which is precisely the disease it was written to cure.
#
# The 2M-row TP-2 run (`SOAK_ROWS=2000000`, the 12 §1.2 bar) is a ~90-minute job whose purpose is a published
# performance number, so it stays one `workflow_dispatch` input away rather than being the nightly default.
#
# The S3 store itest still skips: it needs real object-store credentials, which are a procurement item
# (data-management enable-gates), not something a workflow can conjure. Listed above so its absence stays
# visible rather than being rediscovered as a surprise later.
name: Nightly

on:
  schedule:
    # 03:17 UTC — off the hour on purpose. GitHub's scheduler queues heavily at :00 and a cron that competes
    # with every other repo's midnight job is the one that silently starts skipping runs.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      soak_rows:
        description: "Rows per soak import (blank = 20000, the smallest size at which TP-6's plateau assertion is meaningful; 2000000 = the TP-2 full run)"
        required: false
        type: string

concurrency:
  # A long soak must never stack: two overlapping runs share the Postgres service and the wall-clock budget
  # each asserts against, so the second would fail on timing rather than on truth.
  group: nightly-soak
  cancel-in-progress: false

env:
  ITEST_DATABASE_URL: postgres://leadwolf:leadwolf@localhost:5432/leadwolf
  ITEST_REDIS_URL: redis://localhost:6379
  # Must equal applyMigrations' DEFAULT_APP_ROLE_PASSWORD — the itests call it with no override, so a mismatch
  # fails every file at connection time. Same literal as ci.yml, for the same reason.
  DATABASE_APP_ROLE_PASSWORD: Lw_App_Role_2026!x7Qm
  DATABASE_FORGE_ROLE_PASSWORD: Lw_Forge_Role_2026!x7Qm
  BLIND_INDEX_KEY: ci-blind-index-key-0123456789abcdef
  NIGHTLY_SOAK: "true"

jobs:
  soak:
    name: Import soak — throughput + fairness
    runs-on: ubuntu-latest
    # Generous relative to the smoke default (minutes) so a manual 2M dispatch also fits: that run asserts a
    # 90-minute bar and must be allowed to reach its own conclusion rather than be killed by the runner.
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadwolf
          POSTGRES_PASSWORD: leadwolf
          POSTGRES_DB: leadwolf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadwolf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install (frozen lockfile)
        # Same one-retry as ci.yml: the registry intermittently fails extracting large tarballs.
        run: bun install --frozen-lockfile || (sleep 10 && bun install --frozen-lockfile)

      - name: Soak — throughput
        env:
          # Default 20000 when dispatched without an input and on the schedule — see the header for why the
          # suites own 10000 default cannot satisfy TP-6.
          SOAK_ROWS: ${{ inputs.soak_rows || 20000 }}
        # Each file in its OWN process: the db client is a module singleton, which is why the itest sweep in
        # ci.yml does the same. --timeout so a hung await fails with the test's name instead of eating the
        # job's ceiling in silence.
        #
        # `tee` so the confirm step below can INSPECT this run instead of repeating it. pipefail makes the
        # pipeline carry bun's exit status rather than tee's, so a failing soak still fails this step.
        run: |
          set -o pipefail
          bun test --timeout 3600000 ./packages/db/test/importSoak.nightly.itest.ts 2>&1 \
            | tee /tmp/soak-throughput.log

      - name: Soak — fast-lane fairness under whale load
        env:
          SOAK_WHALE_ROWS: ${{ inputs.soak_rows || 20000 }}
        run: |
          set -o pipefail
          bun test --timeout 3600000 ./apps/workers/test/importSoak.fairness.nightly.itest.ts 2>&1 \
            | tee /tmp/soak-fairness.log

      - name: Confirm the suites actually RAN
        # The whole point of this workflow. Both files skip themselves when NIGHTLY_SOAK is unset, and a
        # skipped bun test still exits 0 — so a green job above proves nothing on its own. If the gate ever
        # regresses (a renamed variable, a dropped env block), this step is what says so out loud instead of
        # letting the workflow report success over a suite that never executed.
        #
        # `always()` because this question matters MOST when a soak failed: "did it fail, or did it never
        # run?" are different incidents, and a skipped step cannot tell you which.
        if: always()
        # It INSPECTS the logs the steps above produced. It used to re-run the throughput suite, which was
        # wrong twice over. It paid for a second 20,000-row soak — the most expensive thing in this job — and
        # it re-ran WITHOUT SOAK_ROWS, so the re-run used the suite's own 10,000-row default, which the header
        # of this file explains at length is the one size where TP-6's plateau assertion cannot hold. This
        # workflow's first real run therefore failed for a reason its own documentation predicted, in a step
        # that then swallowed the evidence: it captured bun's output into a variable under `set -e`, so the
        # shell aborted at the assignment and the echo never ran. "Process completed with exit code 1", no
        # diagnostic. A check that hides its own evidence is the failure it exists to prevent.
        run: |
          set -uo pipefail
          failed=0
          for log in /tmp/soak-throughput.log /tmp/soak-fairness.log; do
            if [ ! -s "$log" ]; then
              echo "::error::$log is missing or empty — the soak step did not get far enough to produce output"
              failed=1
              continue
            fi
            if grep -qiE "^[[:space:]]*0 pass|\(skip\)" "$log"; then
              echo "::error::$log reports no executed tests — NIGHTLY_SOAK gating has regressed"
              echo "--- last 40 lines of $log ---"
              tail -40 "$log"
              failed=1
            else
              echo "ok  $log — the suite executed"
            fi
          done
          exit "$failed"

      # The numbers this workflow exists to produce, on the run page instead of buried in a log nobody
      # downloads. The suites already print them as `[TP-n] …` lines; this lifts those lines verbatim rather
      # than re-deriving anything, so the summary cannot disagree with the run that produced it.
      #
      # `always()` for the same reason as the step above: a FAILED soak is when these numbers are most worth
      # reading, and a summary that only appears on success is a summary you cannot use to diagnose.
      #
      # No thresholds are re-asserted here. The suites own their budgets and fail on them; a second copy of a
      # bound in a shell script is a number that drifts from the one that matters.
      - name: Summarise the soak numbers
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Nightly soak"
            echo
            echo "\`SOAK_ROWS=${{ inputs.soak_rows || 20000 }}\` · commit \`${GITHUB_SHA:0:8}\`"
            echo
            found=0
            for log in /tmp/soak-throughput.log /tmp/soak-fairness.log; do
              [ -s "$log" ] || continue
              # The suites' own instrumentation lines. -h so the filename never leaks into the table.
              while IFS= read -r line; do
                echo "- \`${line}\`"
                found=1
              done < <(grep -hoE "\[TP-[0-9]+\].*" "$log" || true)
            done
            if [ "$found" -eq 0 ]; then
              echo "_No \`[TP-n]\` lines found — the suites did not reach their instrumentation._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
